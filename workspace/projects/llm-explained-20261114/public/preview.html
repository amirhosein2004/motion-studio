<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدل زبانی چطور جواب می‌سازه؟ — پیش‌نمایش</title>
<style>
@font-face{font-family:Vazirmatn;src:url('./fonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:400}@font-face{font-family:Vazirmatn;src:url('./fonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:700}
*{box-sizing:border-box}body{margin:0;background:#090f16;color:#eff7ff;font-family:Vazirmatn,sans-serif;direction:rtl;text-align:right}main{max-width:1380px;margin:0 auto;padding:32px 36px 25px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px}h1{margin:3px 0 0;font-size:24px;line-height:1.6}.eyebrow{margin:0;font-size:12px;color:#91a8ba}a{color:#cbe9fb;text-decoration:none}.guide-link{border:1px solid #2b4052;border-radius:12px;padding:10px 16px;font-size:14px;white-space:nowrap}.guide-link span{margin-right:12px;color:#89d3f5}.viewer{border:1px solid #233747;border-radius:18px;overflow:hidden;box-shadow:0 22px 70px #0004}button{font:inherit;color:#bcd0df;background:transparent;border:1px solid transparent;border-radius:10px;padding:9px 14px;cursor:pointer}button:hover,a:hover{background:#1b2c3b;color:#fff}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #89d3f5;outline-offset:4px}.transport{display:flex;align-items:center;gap:15px;direction:ltr;padding:16px 0}.transport button{font-size:14px;white-space:nowrap}.transport .play{background:#89d3f5;color:#10212d;width:45px;height:42px;padding:0}.scrubber{flex:1;accent-color:#89d3f5;min-width:60px;cursor:pointer}.clock{font-size:13px;color:#9eb4c5;white-space:nowrap;font-variant-numeric:tabular-nums}.chapters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:1px solid #233747;padding-top:18px}.chapters button{display:flex;align-items:center;gap:10px;text-align:right;direction:rtl;font-size:13px;line-height:1.7;padding:10px 12px}.chapters button[aria-current]{background:#172c3d;color:#d5f0ff;border-color:#35546a}.chapter-number{font-size:11px;color:#7594aa}footer{display:flex;justify-content:space-between;gap:16px;margin-top:24px;font-size:12px;color:#8099ad}.error{padding:40px}
@media(max-width:700px){main{padding:20px 16px}header{gap:12px}h1{font-size:18px}.guide-link{font-size:12px;padding:8px}.guide-link span{display:none}.transport{gap:8px}.transport button{font-size:11px;padding:8px}.clock{font-size:11px}.chapters{grid-template-columns:repeat(2,minmax(0,1fr))}.chapters button{font-size:12px}footer{font-size:11px;flex-direction:column;gap:7px}.viewer{border-radius:10px}}
</style></head><body><div id="app"></div><script>window.remotion_staticBase=location.pathname.slice(0,location.pathname.lastIndexOf('/'));</script><script src="./preview-bundle.js"></script></body></html>
